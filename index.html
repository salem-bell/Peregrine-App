<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peregrine Team</title>
<meta name="theme-color" content="#1E5662" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1111" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem("pt-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peregrine">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <div class="bar"><span class="brand"><img src="brand/bird-gold.png" alt=""><span class="shop" id="shop">Peregrine</span></span><span class="saving" id="saving" hidden>Saving…</span><button class="icon" id="refresh" aria-label="Refresh" hidden>↻</button></div>
  <div class="offline" id="offline" hidden>Offline – showing what was saved last</div>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<nav class="tabs" id="tabs" hidden></nav>
<div id="overlay"></div>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
